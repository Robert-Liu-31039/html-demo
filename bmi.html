<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI計算機</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/bmi.css">
    <style>

    </style>

    <script src="js/bmi.js"></script>
</head>

<body>
    <div class="main-title">BMI計算機</div>

    <div id="record"></div>
    <form class="form-style" action="">
        <label for="username">姓名</label>
        <input id="username" name="username" type="text" placeholder="請輸入姓名">
        <br>
        <label for="age">年齡</label>
        <input id="age" name="age" type="number" placeholder="18">
        <br>
        <label for="height">身高</label>
        <input id="height" name="height" type="number" step="0.1" value="178.5">
        <br>
        <label for="weight">體重</label>
        <input id="weight" name="weight" type="number" step="0.1">
        <div class="panel1">
            <input type="radio" name="sex" id="male" value="男生" checked>男
            <input type="radio" name="sex" id="female" value="女生">女
            <label for="country">居住縣市</label>
            <select name="country" id="country">
                <option value="台北市">台北市</option>
                <option value="新北市">新北市</option>
                <option value="桃園市">桃園市</option>
                <option value="台中市">台中市</option>
                <option value="台南市">台南市</option>
                <option value="高雄市">高雄市</option>
            </select>
        </div>
        <button type="button" onclick="calc()">計算</button>
        <button id="deleteRecordBtn" type="button">刪除紀錄</button>
        <button id="downloadBtn" type="button" onclick="save()">儲存紀錄</button>
        <a href="index.html">首頁</a>
    </form>
    <div id="info">
    </div>
    <!-- hidden 會將區塊隱藏起來 -->
    <div id="result" hidden="true">
        BMI: <span class="bmi"></span>
        <p class="comment"></p>
    </div>
    <div id="tableRecord"></div>
    <script>
        const usernameEl = document.querySelector("#username");
        const ageEl = document.querySelector("#age");
        const heightEl = document.querySelector("#height");
        const weightEl = document.querySelector("#weight");
        const countryEl = document.querySelector("#country");
        const sexEl = document.querySelector("input[name='sex']:checked");
        console.log(usernameEl, ageEl, heightEl, weightEl, countryEl, sexEl,
            heightEl.value, weightEl.value, countryEl.value, sexEl.value);

        //物件
        let data = {
            total: 0,
            count: 0
        }

        //陣列
        let datas = JSON.parse(localStorage.getItem("datas")) || [];

        //取得本地網頁儲存的資料
        record = localStorage.getItem("record");

        if (record) {
            data = JSON.parse(record); //JSON.parse() 將字串轉為物件

            //加入顯示紀錄動作
            let avg = (data.total / data.count).toFixed(1);
            document.querySelector("#record").innerHTML = `紀錄人數:${data.count} 平均BMI:${avg}`;

            document.querySelector("#tableRecord").innerHTML = renderTable(datas);
        }
        console.log(record);

        const deleteRecordBtnEl = document.querySelector("#deleteRecordBtn");
        // addEventListener <- 增加事件監聽的行為
        deleteRecordBtnEl.addEventListener("click", function () {
            // confirm() -> 讓使用者確定是否要做刪除的行為
            if (!confirm("是否確定刪除?!")) {
                return;
            }

            //刪除本地網頁儲存的資料
            localStorage.removeItem("record");
            localStorage.removeItem("bmi");
            localStorage.removeItem("datas");

            //甚麼都不做，直接刷新本頁面，將頁面上的資料清掉
            window.location.href = "";

            //清空物件
            /*data = {
                total: 0,
                count: 0
            }*/

            //document.querySelector("#info").innerHTML = "";
        });

        function calc() {
            const height = heightEl.value;
            const weight = weightEl.value;

            // 判斷 height 跟 weight 要大於0 且 是數值(not NaN)
            if (height <= 0 || weight <= 0) {
                alert("請輸入正確數值!");
                return;
            }

            document.querySelector("#result").hidden = false;

            let bmi = getBmi(height, weight);
            let result = getComment(bmi);
            console.log(bmi, result[0], result[1]);

            //document.querySelector("#result").innerHTML = "<h1>BMI:" + bmi + "</h1>";

            //使用 `(esc 鍵下符號) + ${} 可以達到類似 python 的變數與字串結合的寫法!
            /*document.querySelector("#result").innerHTML = `<h1>BMI:${bmi}</h1>
                <p>${comment}</p>`;*/

            let bmiEl = document.querySelector(".bmi");
            bmiEl.innerText = bmi;
            bmiEl.style.color = result[1];
            document.querySelector(".comment").innerText = result[0];

            //取得最新的選取性別
            let sexEl = document.querySelector("input[name='sex']:checked");
            let userInfo = `${usernameEl.value} 年齡:${ageEl.value} 性別:${sexEl.value} 縣市:${countryEl.value}`;
            document.querySelector("#info").innerHTML = `<h2>${userInfo}</h1>`;

            //紀錄每次的 bmi
            data["total"] += Number(bmi); // Number() 將文字轉為數值
            data.count += 1;
            console.log(data);
            let avg = (data.total / data.count).toFixed(1);
            document.querySelector("#record").innerHTML = `紀錄人數:${data.count} 平均BMI:${avg}`;

            //本地網頁儲存的資料
            localStorage.setItem("record", JSON.stringify(data)); //JSON.stringify() 將物件轉為字串
            localStorage.setItem("bmi", bmi);

            //儲存單筆資料
            let person = {
                name: usernameEl.value,
                age: ageEl.value,
                sex: sexEl.value,
                country: countryEl.value,
                height: height,
                weight: weight,
                bmi: bmi
            }

            datas.push(person); //push() -> 將資料放入陣列之內
            console.log(datas);

            //本地網頁儲存的資料
            localStorage.setItem("datas", JSON.stringify(datas));

            document.querySelector("#tableRecord").innerHTML = renderTable(datas);
        }

        function addRow(data) {
            return `
                <tr>
                    <td>${data.name}</td>
                    <td>${data.country}</td>
                    <td>${data.age}</td>
                    <td>${data.sex}</td>
                    <td>${data.height}</td>
                    <td>${data.weight}</td>
                    <td>${data.bmi}</td>
                </tr>
            `;
        }

        function renderTable(datas) {
            let tableData = "";

            for (let i = 0; i < datas.length; i++) {
                tableData += addRow(datas[i]);
            }

            let tableHtml = `
                <table border="1px">
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>縣市</th>
                            <th>年齡</th>
                            <th>性別</th>
                            <th>身高</th>
                            <th>體重</th>
                            <th>BMI</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableData}
                    </tbody>
                </table>
            `;

            return tableHtml;
        }

        function save() {
            //產生一個超連結，儲存 JSON 格式
            let datas = JSON.parse(localStorage.getItem("datas"));
            console.log(datas);

            if (datas == null || datas.length == 0) {
                alert('目前無紀錄!');
                return;
            }

            //儲存 JSON 格式
            let jsonStr = JSON.stringify(datas)

            //產生 二進制
            const blobData = new Blob([jsonStr], { type: "application/json" });

            //將二進制的內容轉為 url，且記憶在記憶體上 
            const url = URL.createObjectURL(blobData);
            console.log(url);

            //產生一個超連結的物件
            const a = document.createElement("a");
            a.href = url;
            a.download = "records.json";
            document.body.appendChild(a);
            a.text = "download";
            a.click();

            //移除超連結的物件，為了讓畫面好看
            document.body.removeChild(a);

            //釋放記憶在記憶體上的東西
            URL.revokeObjectURL(url);
        }

    </script>
</body>

</html>
